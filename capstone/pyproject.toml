[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfrating"
version = "1.0.0"
authors = [{ name = "Mohamed Miled" }]
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy",
                "statsmodels", "scikit-learn",
                "jinja2"]

[tool.setuptools]
packages = ["sfrating"]

[tool.pytest.ini_options]
testpaths = ["tests"]
